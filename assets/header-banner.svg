<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <!-- Glowing Waves Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="240" rx="16" fill="url(#grid)" />
  <rect width="1000" height="240" rx="16" stroke="#30363d" stroke-width="1.5" />

  <!-- Flowing Dynamic Waves -->
  <path d="M0 160 C 250 120, 450 220, 700 170 C 850 140, 950 190, 1000 180 L 1000 240 L 0 240 Z" fill="url(#waveGrad2)" />
  <path d="M0 180 C 200 230, 400 140, 650 190 C 800 220, 900 160, 1000 200 L 1000 240 L 0 240 Z" fill="url(#waveGrad1)" />

  <!-- Corner Brackets (Cyber Aesthetic) -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 976 40 L 976 24 L 960 24" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 24 200 L 24 216 L 40 216" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 976 200 L 976 216 L 960 216" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- System Badge -->
  <g transform="translate(42, 38)">
    <rect width="180" height="24" rx="12" fill="#161b22" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="12" r="4" fill="#00c853">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FE" letter-spacing="1.5">SYS_CORE: ONLINE</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(830, 38)">
    <rect width="130" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">CAIRO, EGYPT 🇪🇬</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#titleGrad)" letter-spacing="1.5" filter="url(#glow)">
    Yahia Elhamzawy
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace" font-size="16" font-weight="600" fill="#00F2FE" letter-spacing="2">
    SYSTEMS ARCHITECT • AUTONOMOUS ROBOTICS • MULTIMODAL AI
  </text>

  <!-- Core Pillars Tagline -->
  <text x="500" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#8b949e" letter-spacing="1">
    Rust Core &amp; Linux 6.8 • ESP32 Flight &amp; Rover Fleets • Java Spring Boot • Gemini &amp; Groq AI
  </text>
</svg>