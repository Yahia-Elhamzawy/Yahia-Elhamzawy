name: Generate Contribution Snake Animation (Nokia 1999 Bug Hunter Edition)

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual execution from the Actions tab anytime
  workflow_dispatch:

  # Also runs every time you push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Multi-Theme Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Yahia-Elhamzawy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#0d1117,#2a124d,#5c1685,#a855f7,#ff007f
            dist/github-snake-nokia.svg?color_snake=#1b2413&color_dots=#9ea786,#8c9b74,#768560,#5a6946,#334125
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
